; ============================================================
; Foreseeker (BepInEx plugin) - 配置文件
; 放在 BepInEx\plugins\ 下、与 Foreseeker.dll 同目录。
; 修改保存后约 1 秒自动生效（无需重启游戏）。
;
; 键名 = UnityEngine.KeyCode 的枚举名，例如：
;   F1 F2 ... F12, A-Z, 0-9, Space, Tab, Escape,
;   LeftShift, RightShift, LeftControl, RightControl, LeftAlt, RightAlt,
;   UpArrow, DownArrow, LeftArrow, RightArrow, Keypad0-9, Mouse0-2 ...
; 值留空 = 禁用该键。
; ============================================================

[Foreseeker]

; 显示 / 隐藏窗口的切换键（默认 F2）
ToggleKey = F2

; 备用切换键（默认 F7，留空 = 禁用）
ToggleKeyAlt = F7

; 把窗口移回左侧中间的键（默认 F8）
ResetPositionKey = F8

; ==================== 存档读数器 ====================
; 是否启用（默认 true）。启用后每 N 秒检查最新存档，
; 有变化就把战况写到 BepInEx\plugins\Foreseeker\ 下：
;   save_latest.txt / save_latest.json / save_log.txt
SaveReaderEnabled = true

; 检查间隔（秒，最小 1，默认 5）
SaveReaderInterval = 5

; 右侧「DD2 状态读取」窗口启动时是否显示（true=显示，false=默认关闭，F9 仍可临时开关）
StateWindowVisible = true
